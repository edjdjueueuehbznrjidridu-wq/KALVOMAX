name: Build KALVO APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Buildozer Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          set -euo pipefail
          if [ -f main.py ] && [ -f buildozer.spec ]; then
            echo "Project already at root"
            ls -la
            exit 0
          fi
          ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          if [ -z "${ZIP:-}" ]; then
            echo "ERROR: no main.py and no zip in repo root"
            ls -la
            exit 1
          fi
          echo "Extracting: $ZIP"
          unzip -o "$ZIP" -d _e
          if [ -f _e/main.py ] && [ -f _e/buildozer.spec ]; then
            cp -a _e/. .
          else
            SUB=$(find _e -name main.py | head -1 | xargs -r dirname)
            if [ -z "${SUB:-}" ] || [ ! -f "$SUB/buildozer.spec" ]; then
              echo "main.py/buildozer.spec not found inside zip"
              find _e -maxdepth 3 -type f | head -50
              exit 1
            fi
            cp -a "$SUB"/. .
          fi
          rm -rf _e
          echo "=== root after extract ==="
          ls -la
          test -f main.py
          test -f buildozer.spec
          test -d apex

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git unzip zip openjdk-17-jdk python3-pip python3-setuptools \
            autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev libltdl-dev \
            libjpeg-dev libpng-dev gettext libsqlite3-dev \
            ccache build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "cython<3.0" buildozer
          buildozer --version

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer -v android debug

      - name: Show APK
        if: always()
        run: |
          ls -la bin/ || true
          find . -name "*.apk" 2>/dev/null | head -20 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KALVO-Market-Lab-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 21
